<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Dark Gradient Background -->
    <linearGradient id="darkBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Sun Core Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDE40" />
      <stop offset="100%" stop-color="#FF9E00" />
    </linearGradient>

    <!-- Front Cloud Gradient -->
    <linearGradient id="frontCloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#DDF0FF" />
    </linearGradient>

    <!-- Back Cloud Gradient -->
    <linearGradient id="backCloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark App Icon Background -->
  <rect width="64" height="64" rx="14" fill="url(#darkBgGrad)" />

  <!-- Sun Component -->
  <g stroke="#0F172A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 12 Triangular Rays -->
    <polygon points="32,8 29.5,15 34.5,15" fill="#FFC800" />
    <polygon points="32,56 29.5,49 34.5,49" fill="#FFC800" />
    <polygon points="8,32 15,29.5 15,34.5" fill="#FFC800" />
    <polygon points="56,32 49,29.5 49,34.5" fill="#FFC800" />

    <polygon points="15,15 21,18.5 18.5,21" fill="#FFC800" />
    <polygon points="49,15 43,18.5 45.5,21" fill="#FFC800" />
    <polygon points="15,49 21,45.5 18.5,43" fill="#FFC800" />
    <polygon points="49,49 43,45.5 45.5,43" fill="#FFC800" />

    <polygon points="22,10 24.5,17 28.5,15" fill="#FFC800" />
    <polygon points="42,10 39.5,17 35.5,15" fill="#FFC800" />
    <polygon points="54,22 47,24.5 49,28.5" fill="#FFC800" />
    <polygon points="54,42 47,39.5 49,35.5" fill="#FFC800" />

    <!-- Central Sun Circle -->
    <circle cx="32" cy="32" r="12" fill="url(#sunGrad)" filter="url(#shadow)" />
  </g>

  <!-- Back Cloud -->
  <path d="M 38 35 
           C 35 35, 33 32, 34 29 
           C 35 25, 39 23, 42 25 
           C 44 20, 51 19, 54 23 
           C 57 23, 59 26, 58 30 
           C 56 35, 52 35, 52 35 
           Z" 
        fill="url(#backCloudGrad)" 
        stroke="#0F172A" 
        stroke-width="2" 
        stroke-linejoin="round" />

  <!-- Front Cloud -->
  <path d="M 20 48 
           C 14 48, 11 43, 13 37 
           C 14 31, 21 29, 26 32 
           C 29 24, 41 23, 45 30 
           C 51 30, 54 36, 51 42 
           C 49 48, 43 48, 43 48 
           Z" 
        fill="url(#frontCloudGrad)" 
        stroke="#0F172A" 
        stroke-width="2.2" 
        stroke-linejoin="round" 
        filter="url(#shadow)" />
</svg>
